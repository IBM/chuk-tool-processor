name: _debug-docker
on:
  workflow_dispatch:
  push:
    branches: [feat/isolated-code-execution]
    paths: [".github/workflows/_debug-docker.yml"]

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv python install 3.12
      - run: uv sync --dev
      - name: docker available?
        run: docker version && docker info | head -20
      - name: run DockerBackend end-to-end (native Linux)
        run: |
          uv run python - <<'PY'
          import asyncio
          from dataclasses import dataclass
          from chuk_tool_processor.execution.isolation import IsolatedCodeRunner, DockerBackend, IsolationLimits

          @dataclass
          class Info: namespace: str; name: str
          class AddTool:
              async def execute(self, a, b): return {"sum": int(a)+int(b)}
          class Reg:
              async def list_tools(self, namespace=None): return [Info("math","add")]
              async def get_tool(self, name, namespace="default"): return AddTool() if name=="add" else None

          ADD_LOOP = "total = 0\nfor i in range(1, 6):\n    r = await add(a=str(total), b=str(i))\n    total = r['sum']\nreturn total\n"

          async def main():
              b = DockerBackend(docker_bin="docker")
              print("is_available:", b.is_available())
              runner = IsolatedCodeRunner(b, registry=Reg(), namespace="math", limits=IsolationLimits(wall_timeout=120))
              r = await runner.run(ADD_LOOP)
              print("OK:", r.ok, "VALUE:", r.value, "TOOLCALLS:", r.tool_calls)
              print("ERROR_TYPE:", r.error_type)
              print("ERROR:", r.error)
              print("STDERR:\n", r.stderr)
              print("STDOUT:\n", r.stdout)
          asyncio.run(main())
          PY
